# Compose usado pelo Dokploy (fonte git, branch master): constroi a imagem deste repo, sem depender de tags.
services:
  ownfoil:
    build:
      context: .
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      USER_ADMIN_NAME: ${USER_ADMIN_NAME:-admin}
      USER_ADMIN_PASSWORD: ${USER_ADMIN_PASSWORD:?Defina USER_ADMIN_PASSWORD}
    volumes:
      - ${OWNFOIL_GAMES_PATH:-/mnt/HDD/switch}:/games
      - ${OWNFOIL_CONFIG_PATH:-/mnt/docker/ownfoil}/config:/app/config
      - ${OWNFOIL_CONFIG_PATH:-/mnt/docker/ownfoil}/data:/app/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8465/', timeout=4)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 60s
